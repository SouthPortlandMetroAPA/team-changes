<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Team Changes — South Portland Metro APA</title>
<!--
  ============================================================================
  Team Changes — index.html  (public, phone-first, guided walkthrough)
  ============================================================================
  Brief: tools/claude/briefs/2026-09-12-team-changes-app.md  (T1)
  A captain or co-captain sends the league ONE request per team holding any of:
  new captain · new co-captain · mailing contact · add player(s) · drop player(s).
  This is a REQUEST QUEUE: the league approves in Slate ▸ Team Changes, makes
  the change in APA Member Services, then marks it applied. Nothing here edits
  a roster directly.
  Add/drop are gated per division — open the day AFTER that division's week-4
  match (before that, the APA app handles roster edits). Captain / co-captain /
  mailing changes are open any time.
  AUTH: Shipmate magic-link model. email/APA# → link to the address on file →
  ?token= activates a durable localStorage session. Only team LEADERS get a link.
  Authority is derived server-side (GAS tc_* actions) from slate.team_memberships;
  the client never decides who may change what.
  All POSTs go to the GAS apa-mailer as text/plain (never application/json).
  Branding: sources spm-base.css; screen/chip/btn classes mirror Shipmate.
  ============================================================================
-->
<link rel="stylesheet" href="https://southportlandmetroapa.github.io/shared/spm-base.css">
<style>
  :root{ --ok:#0a7d33; --warn:#8a5a00; --tap:52px; }
  body{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .spm-page{ max-width:600px; flex:1; display:flex; flex-direction:column; }
  .tc-ctl{ display:flex; align-items:center; gap:8px; margin:-4px 0 12px; min-height:24px; }
  .tc-ctl .sp{ flex:1; }
  .stepno{ font-size:.78rem; color:var(--muted); letter-spacing:.3px; }
  .tc-lnk{ background:none; border:none; color:var(--muted); font:inherit; font-size:.85rem; cursor:pointer; padding:6px 8px; border-radius:10px; }
  .tc-lnk:hover{ background:#eceff5; color:var(--text); }
  .tc-prog{ height:6px; background:#e6eaf2; border-radius:99px; overflow:hidden; margin:0 0 14px; }
  .tc-prog>i{ display:block; height:100%; background:linear-gradient(135deg,var(--spm-primary),var(--spm-accent)); width:0; transition:width .3s ease; }
  .screen{ background:var(--card); border:1px solid var(--border); border-radius:22px; padding:22px 20px; box-shadow:0 3px 10px rgba(0,0,0,.1); animation:pop .25s ease; }
  @keyframes pop{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  .screen h2{ font-size:1.3rem; line-height:1.3; margin:0 0 6px; font-weight:900; letter-spacing:-.02em; }
  .hint{ color:var(--muted); margin:0 0 16px; }
  .grow{ flex:1; }
  .choice{ display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--border); border-radius:16px; padding:16px 18px; margin-top:12px; font:inherit; cursor:pointer; min-height:var(--tap); transition:border-color .15s,background .15s; color:var(--text); }
  .choice:hover,.choice:focus-visible{ border-color:var(--spm-accent); background:#f7f9ff; outline:none; }
  .choice b{ display:block; font-size:1.05rem; margin-bottom:2px; }
  .choice span{ color:var(--muted); font-size:.88rem; display:block; }
  .choice .tag{ display:inline-block; font-size:.74rem; font-weight:700; letter-spacing:.04em; border-radius:999px; padding:3px 9px; margin-top:6px; background:#eef2ff; color:var(--spm-accent); }
  .choice .tag.pending{ background:#fff3cd; color:var(--warn); }
  .choice .tag.approved{ background:#e6f7ec; color:var(--ok); }
  .choice .tag.closed{ background:#f1f1f1; color:var(--muted); }
  .chips{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-top:4px; }
  .chip{ border:2px solid var(--border); background:#fff; border-radius:14px; padding:12px 14px; font:inherit; font-size:.96rem; cursor:pointer; min-height:var(--tap); display:inline-flex; align-items:center; justify-content:center; text-align:center; gap:6px; color:var(--text); white-space:normal; line-height:1.2; }
  .chip[aria-pressed="true"]{ border-color:var(--spm-accent); background:#eef2ff; color:var(--spm-accent); font-weight:600; }
  .chip .tick{ opacity:0; font-weight:700; } .chip[aria-pressed="true"] .tick{ opacity:1; }
  .chip:disabled{ opacity:.45; cursor:not-allowed; }
  .person{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:2px solid var(--border); background:#fff; border-radius:14px; padding:12px 14px; margin-top:10px; font:inherit; cursor:pointer; min-height:var(--tap); color:var(--text); }
  .person[aria-pressed="true"]{ border-color:var(--spm-accent); background:#eef2ff; }
  .person .who{ flex:1; } .person .who b{ display:block; } .person .who span{ display:block; color:var(--muted); font-size:.85rem; }
  .person .role{ font-size:.72rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; border-radius:999px; padding:3px 8px; background:#f1f1f1; color:var(--muted); }
  .person .role.lead{ background:linear-gradient(135deg,var(--spm-primary),var(--spm-accent)); color:#fff; }
  .person .box{ width:22px; height:22px; border:2px solid var(--border); border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-weight:900; color:#fff; flex:0 0 auto; }
  .person[aria-pressed="true"] .box{ background:var(--spm-accent); border-color:var(--spm-accent); }
  .person:disabled{ opacity:.5; cursor:not-allowed; }
  .btn.block{ width:100%; }
  label.fld{ display:block; font-size:.9rem; color:var(--muted); margin:14px 0 6px; }
  input[type=text],input[type=email],input[type=tel],textarea,select{ width:100%; font:inherit; padding:13px 14px; border:2px solid var(--border); border-radius:12px; background:#fff; min-height:var(--tap); color:var(--text); }
  textarea{ min-height:110px; resize:vertical; }
  input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--spm-accent); }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row{ display:flex; gap:10px; margin-top:20px; }
  .btn{ flex:1; font:inherit; font-weight:700; font-size:1rem; border:none; border-radius:999px; padding:14px 20px; cursor:pointer; min-height:var(--tap); transition:filter .15s,transform .15s; }
  .btn:hover{ filter:brightness(1.08); transform:translateY(-1px); } .btn:active{ transform:translateY(0); }
  .btn.primary{ background:linear-gradient(135deg,var(--spm-primary),var(--spm-accent)); color:#fff; }
  .btn.primary:disabled{ background:#c9ccd6; cursor:not-allowed; filter:none; transform:none; }
  .btn.ghost{ background:#fff; color:var(--text); border:2px solid var(--border); flex:0 0 auto; }
  .btn.danger{ background:#fff; color:var(--spm-primary); border:2px solid #f6c9d1; flex:0 0 auto; }
  .err{ color:var(--spm-primary); font-size:.9rem; margin-top:10px; min-height:1.1em; } .err.ok{ color:var(--ok); }
  .review .item{ border-top:1px solid var(--border); padding:12px 0; display:flex; gap:12px; align-items:flex-start; }
  .review .item:first-child{ border-top:none; }
  .review dt{ flex:0 0 38%; color:var(--muted); font-size:.9rem; } .review dd{ flex:1; font-weight:600; word-break:break-word; margin:0; }
  .review dd small{ display:block; font-weight:400; color:var(--muted); }
  .callout{ background:#fff6f7; border:1px solid #f6c9d1; border-radius:14px; padding:12px 14px; margin-top:14px; font-size:.92rem; color:#8a1226; }
  .note{ background:#f7f9ff; border:1px solid #d9e2ff; border-radius:14px; padding:12px 14px; margin-top:14px; font-size:.92rem; color:#1f3a8a; }
  .center{ text-align:center; } .big-emoji{ font-size:2.4rem; display:block; margin-bottom:8px; }
  .spin{ display:inline-block; width:18px; height:18px; border:3px solid #d7deea; border-top-color:var(--spm-accent); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-3px; }
  @keyframes sp{ to{ transform:rotate(360deg) } }
  .addrow{ display:flex; gap:8px; align-items:center; margin-top:10px; }
  .addrow input{ flex:1; }
  .addrow .btn{ flex:0 0 auto; padding:0 18px; }
  .added{ margin-top:10px; }
  .added .person{ cursor:default; }
  .added .rm{ background:none; border:none; color:var(--spm-primary); font:inherit; font-weight:700; cursor:pointer; padding:6px 8px; }
  .status-pill{ display:inline-block; font-size:.78rem; font-weight:800; letter-spacing:.04em; border-radius:999px; padding:4px 10px; }
  .status-pill.pending{ background:#fff3cd; color:var(--warn); } .status-pill.approved{ background:#e6f7ec; color:var(--ok); }
  .status-pill.applied{ background:#e6f7ec; color:var(--ok); } .status-pill.rejected{ background:#fde2e6; color:#8a1226; } .status-pill.withdrawn{ background:#f1f1f1; color:var(--muted); }
  .preprod-banner{ background:#fff3cd; color:#5a4200; text-align:center; font-weight:700; padding:8px; border-radius:12px; margin-bottom:12px; }
</style>
</head>
<body>
<div class="spm-page">
  <header class="spm-header">
    <h1>Team Changes</h1>
    <p class="spm-subtitle">Captain &middot; Co-captain &middot; Mailing contact &middot; Roster</p>
  </header>
  <div class="preprod-banner" id="preprodBanner" hidden>PREPROD — emails go to the league office, not to you</div>
  <div class="tc-ctl" id="ctl" hidden>
    <span class="stepno" id="stepNo"></span>
    <span class="sp"></span>
    <button class="tc-lnk" id="myTeams" hidden>&larr; My teams</button>
    <button class="tc-lnk" id="logout" hidden>Log out</button>
  </div>
  <div class="tc-prog" id="progWrap" hidden><i id="progBar"></i></div>
  <main id="app" class="grow"></main>
  <footer class="spm-footer">South Portland Metro APA &middot; Have Fun. Meet People. Play Pool.</footer>
</div>
<script>
"use strict";
/* ── config ─────────────────────────────────────────────────────────────── */
var APP_VERSION = '0.2';
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzGTzkBRTrIIP_tD6sbtOOUmNZkXDdtxPoO4c8fdWt5h3tZFueNSISPv8Q3LWStx73Whw/exec';
var IS_PREPROD = /\/preprod\//.test(location.pathname);
var SKEY = 'teamchanges_session';
var KIND_LABEL = { captain:'New captain', cocaptain:'New co-captain', mailing:'Mailing contact', add:'Add player', drop:'Drop player' };
/* ── state ──────────────────────────────────────────────────────────────── */
var S = { token:null, signedIn:false, firstName:'', member:null, teams:[], sessionName:'', team:null, detail:null,
          kinds:[], A:{}, step:0, view:null, editingId:null };
var app = document.getElementById('app');
document.getElementById('preprodBanner').hidden = !IS_PREPROD;
/* ── GAS call (text/plain — no CORS preflight) ──────────────────────────── */
function gas(action, extra){
  var payload = Object.assign({ action: action, is_preprod: IS_PREPROD }, extra || {});
  return fetch(GAS_URL, { method:'POST', body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .catch(function(){ return { ok:false, error:'Network hiccup. Check your connection and try again.' }; });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function spinScreen(msg){ return '<div class="screen center"><span class="spin"></span><p class="hint" style="margin-top:12px">'+esc(msg)+'</p></div>'; }
function fmtDate(iso){ if(!iso) return ''; var d=new Date(iso); return isNaN(d)?String(iso):d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDay(ymd){ if(!ymd) return ''; var p=String(ymd).split('-'); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
/* ── header chrome ──────────────────────────────────────────────────────── */
function chrome(){
  document.getElementById('myTeams').hidden = !(S.signedIn && S.view!=='teams' && S.view!=='login' && S.view!=='sent');
  document.getElementById('logout').hidden = !S.signedIn;
  document.getElementById('ctl').hidden = !S.signedIn;
  var showProg = S.view==='step';
  document.getElementById('progWrap').hidden = !showProg;
  var stepNo = document.getElementById('stepNo');
  if(showProg){ var n=activeSteps().length, i=Math.min(S.step,n-1); stepNo.textContent='Step '+(i+1)+' of '+n; document.getElementById('progBar').style.width=Math.round(((i+1)/n)*100)+'%'; }
  else stepNo.textContent='';
}
document.getElementById('myTeams').onclick = function(){
  if(S.view==='step' && !confirm('Leave this request? Your unsent answers will be cleared.')) return;
  resetDraft(); loadTeams();
};
document.getElementById('logout').onclick = function(){
  gas('tc_logout', { token:S.token });
  try{ localStorage.removeItem(SKEY); }catch(e){}
  S.token=null; S.signedIn=false; S.firstName=''; resetDraft(); S.teams=[]; S.team=null; S.detail=null;
  showLogin();
};
function resetDraft(){ S.kinds=[]; S.A={}; S.step=0; S.editingId=null; }
/* ── screen: login (email/APA → magic link) ─────────────────────────────── */
function showLogin(prefillErr){
  S.view='login'; chrome();
  app.innerHTML =
    '<div class="screen">'+
      '<h2>Send the league a change for your team</h2>'+
      '<p class="hint">For captains and co-captains. Enter your email or APA number and we’ll send a one-tap sign-in link to the email on file. No password.</p>'+
      '<label class="fld" for="ident">Email or APA number</label>'+
      '<input id="ident" type="text" autocomplete="email" inputmode="email" placeholder="you@example.com or 8-digit APA #">'+
      '<input id="hp" type="text" style="position:absolute;left:-9999px" tabindex="-1" autocomplete="off" aria-hidden="true">'+
      '<div class="err" id="err">'+esc(prefillErr||'')+'</div>'+
      '<div class="row"><button class="btn primary" id="send">Send my link</button></div>'+
      '<div class="note">Roster adds and drops open the day after your division’s week-4 match. Before that, use the APA app for roster changes. Captain, co-captain and mailing-contact changes can be sent any time.</div>'+
    '</div>';
  var send = document.getElementById('send');
  send.onclick = function(){
    var v = document.getElementById('ident').value.trim(), err = document.getElementById('err');
    if(!v){ err.textContent='Enter your email or APA number.'; return; }
    send.disabled=true; send.innerHTML='<span class="spin"></span>';
    gas('tc_link_request', { identifier:v, hp:document.getElementById('hp').value }).then(function(res){
      send.disabled=false; send.textContent='Send my link';
      if(!res.ok){ err.textContent=res.error||'Something went wrong. Try again.'; return; }
      showSent(v, res.masked_email);
    });
  };
  document.getElementById('ident').addEventListener('keydown',function(e){ if(e.key==='Enter') send.click(); });
}
function showSent(dest, masked){
  S.view='sent'; chrome();
  app.innerHTML =
    '<div class="screen center"><span class="big-emoji">📧</span><h2>Check your email</h2>'+
      '<p class="hint">A sign-in link is on its way'+(masked?(' to '+esc(masked)):' to your email on file')+'. Tap it on this device to keep going. The link works for 30 minutes.</p>'+
      '<div class="row"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="resend">Resend link</button></div>'+
      '<div class="err" id="err"></div></div>';
  document.getElementById('back').onclick = function(){ showLogin(); };
  document.getElementById('resend').onclick = function(){
    var b=this; b.disabled=true; b.innerHTML='<span class="spin"></span>';
    gas('tc_link_request', { identifier:dest }).then(function(res){ b.disabled=false; b.textContent='Resend link'; var err=document.getElementById('err'); err.className='err'+(res.ok?' ok':''); err.textContent=res.ok?'Sent again — check your inbox.':(res.error||'Could not resend.'); });
  };
}
/* ── screen: my teams ───────────────────────────────────────────────────── */
function loadTeams(){
  S.view='loading'; chrome(); app.innerHTML = spinScreen('Loading your teams…');
  gas('tc_my_teams', { token:S.token }).then(function(res){
    if(!res.ok){ handleSessionErr(res.error); return; }
    S.teams = res.teams||[]; S.sessionName = res.session_name||''; S.member = res.member_number||null;
    showTeams();
  });
}
function gateLine(t){
  var g = t.gate||{};
  if(g.open) return '<span class="tag">Roster changes open</span>';
  return '<span class="tag closed">Roster changes open '+(g.opens_after?('after '+esc(fmtDay(g.opens_after))):'after week 4')+'</span>';
}
function showTeams(){
  S.view='teams'; chrome();
  if(!S.teams.length){
    app.innerHTML='<div class="screen"><h2>No teams to change</h2><p class="hint">You’re not listed as a captain or co-captain of a '+esc(S.sessionName||'current')+' team. If that’s wrong, contact the league office.</p></div>';
    return;
  }
  app.innerHTML =
    '<div class="screen"><h2>'+(S.firstName?('Hi '+esc(S.firstName)+' — which team?'):'Which team?')+'</h2>'+
    '<p class="hint">'+esc(S.sessionName)+' teams you lead. Tap one to see its roster and send a change.</p>'+
    S.teams.map(function(t,i){
      var r=t.open_request;
      return '<button class="choice" data-i="'+i+'"><b>'+esc(t.team_name||('Team '+t.team_number))+' <span style="display:inline;color:var(--muted);font-weight:400">#'+esc(t.team_number)+'</span></b>'+
        '<span>'+esc(t.division_number)+' '+esc(t.division_name)+' · '+esc(t.format)+' · '+esc(t.night_of_play)+' · you: '+esc(t.my_role)+'</span>'+
        gateLine(t)+(r?(' <span class="tag '+esc(r.status)+'">Request '+esc(r.status)+'</span>'):'')+'</button>';
    }).join('')+'</div>';
  Array.prototype.forEach.call(app.querySelectorAll('.choice'), function(el){ el.onclick=function(){ openTeam(S.teams[+el.getAttribute('data-i')]); }; });
}
/* ── screen: team hub (roster + mailing + current request) ──────────────── */
function openTeam(t){
  S.team=t; S.view='loading'; chrome(); app.innerHTML=spinScreen('Loading '+(t.team_name||'the team')+'…');
  gas('tc_team', { token:S.token, team_id:t.team_id }).then(function(res){
    if(!res.ok){ if(/session/i.test(res.error||'')){ handleSessionErr(res.error); return; } app.innerHTML='<div class="screen"><h2>Hmm</h2><p class="hint">'+esc(res.error)+'</p></div>'; return; }
    S.detail=res; S.team=res.team; S.team.gate=res.gate; showHub();
  });
}
function personRow(m, opts){
  opts=opts||{};
  var lead = m.role==='Captain'||m.role==='Co-Captain';
  return '<div class="person" style="cursor:default"><div class="who"><b>'+esc(m.name)+(m.nickname?(' <span style="display:inline;font-weight:400;color:var(--muted)">“'+esc(m.nickname)+'”</span>'):'')+'</b><span>#'+esc(m.member_number)+'</span></div><span class="role'+(lead?' lead':'')+'">'+esc(m.role)+'</span></div>';
}
/* Mailing contact is a NAME only — the app never shows an address (the league uses the
   contact's APA record). */
function mailingText(m){ if(!m) return 'None on file yet'; return m.name || m.contact_name || 'None on file yet'; }
function itemsList(items){
  return '<dl class="review">'+(items||[]).map(function(it){
    var was = it.before ? (it.kind==='mailing' ? it.before.contact_name : (it.kind!=='drop'&&it.kind!=='add' ? it.before.name : '')) : '';
    var v = esc(it.player_name||'')+' <small>#'+esc(it.member_number||'')+(was?(' · was '+esc(was)):'')+(it.kind==='mailing'?' · mail goes to their address on file':'')+(it.note?(' · '+esc(it.note)):'')+'</small>';
    return '<div class="item"><dt>'+esc(KIND_LABEL[it.kind]||it.kind)+'</dt><dd>'+v+'</dd></div>';
  }).join('')+'</dl>';
}
function showHub(){
  S.view='hub'; chrome();
  var d=S.detail, t=S.team, r=d.request, g=d.gate||{};
  var open = r && (r.status==='pending'||r.status==='approved');
  var html = '<div class="screen"><h2>'+esc(t.team_name||('Team '+t.team_number))+'</h2>'+
    '<p class="hint">#'+esc(t.team_number)+' · '+esc(t.division_number)+' '+esc(t.division_name)+' · '+esc(t.format)+' · '+esc(t.night_of_play)+'</p>';
  if(r){
    html += '<div class="'+(open?'note':'callout')+'" style="margin-top:0"><b>'+(open?'Your request is '+esc(r.status):'Last request: '+esc(r.status))+'</b> <span class="status-pill '+esc(r.status)+'">'+esc(r.status)+'</span><br><small>Sent '+esc(fmtDate(r.created_at))+(r.decided_at?(' · decided '+esc(fmtDate(r.decided_at))):'')+(r.applied_at?(' · applied '+esc(fmtDate(r.applied_at))):'')+'</small>'+
      (r.operator_note?('<br><small>League note: '+esc(r.operator_note)+'</small>'):'')+'</div>'+itemsList(r.items);
    if(open){
      html += '<div class="row">'+(r.status==='pending'?'<button class="btn danger" id="withdraw">Withdraw</button>':'')+(r.status==='pending'?'<button class="btn primary" id="edit">Edit request</button>':'<div class="hint" style="margin:0">Approved — being entered in APA. Contact the league office to change it.</div>')+'</div>';
    }
  }
  if(!open){
    html += '<div class="row" style="margin-top:14px"><button class="btn primary" id="newReq">Request a change</button></div>';
  }
  html += '<h2 style="margin-top:22px;font-size:1.05rem">Roster ('+d.roster.length+')</h2>'+d.roster.map(personRow).join('')+
    '<h2 style="margin-top:22px;font-size:1.05rem">Mailing contact</h2><p class="hint" style="margin:0">'+esc(mailingText(d.mailing))+'</p>'+
    '<p class="hint" style="margin-top:14px;font-size:.85rem">'+(g.open?'Roster adds and drops are open for this division.':('Roster adds and drops open '+(g.opens_after?('after '+esc(fmtDay(g.opens_after))):'after week 4')+'. Until then, use the APA app.'))+'</p></div>';
  app.innerHTML = html;
  var nb=document.getElementById('newReq'); if(nb) nb.onclick=function(){ resetDraft(); startBuilder(); };
  var eb=document.getElementById('edit'); if(eb) eb.onclick=function(){ startEdit(r); };
  var wb=document.getElementById('withdraw'); if(wb) wb.onclick=function(){ showWithdraw(r); };
}
function startEdit(r){
  resetDraft(); S.editingId=r.id;
  var kinds=[], A={ adds:[], drops:[], dropNotes:{} };
  (r.items||[]).forEach(function(it){
    if(kinds.indexOf(it.kind)<0 && it.kind!=='add' && it.kind!=='drop') kinds.push(it.kind);
    if(it.kind==='captain') A.captain=it.member_number;
    if(it.kind==='cocaptain') A.cocaptain=it.member_number;
    if(it.kind==='mailing') A.mailing=it.member_number;
    if(it.kind==='add'){ if(kinds.indexOf('add')<0) kinds.push('add'); A.adds.push({ member_number:it.member_number, name:it.player_name, flags:[] }); }
    if(it.kind==='drop'){ if(kinds.indexOf('drop')<0) kinds.push('drop'); A.drops.push(it.member_number); if(it.note) A.dropNotes[it.member_number]=it.note; }
  });
  A.reason=r.reason||'';
  S.kinds=kinds; S.A=A; startBuilder(true);
}
/* ── builder: what → per-kind steps → reason → review ───────────────────── */
function startBuilder(keep){
  if(!keep){ S.A={ adds:[], drops:[], dropNotes:{} }; S.kinds=[]; }
  S.step=0; showWhat();
}
function rosterAll(){ return (S.detail&&S.detail.roster)||[]; }
function candidates(){ // roster + players being added in this request
  return rosterAll().concat((S.A.adds||[]).map(function(a){ return { member_number:a.member_number, name:a.name, role:'(adding)' }; }));
}
function showWhat(){
  S.view='what'; chrome();
  var g=(S.team&&S.team.gate)||{};
  var opts=[ ['captain','New captain','Pick a new captain from the roster'], ['cocaptain','New co-captain','Pick a new co-captain from the roster'], ['mailing','Mailing contact','Which player receives the team’s patches and mail'], ['add','Add player(s)','By APA number'], ['drop','Drop player(s)','From the current roster'] ];
  app.innerHTML = '<div class="screen"><h2>What do you want to change?</h2><p class="hint">Pick everything that applies — it all goes in one request.</p><div class="chips">'+
    opts.map(function(o){ var dis = (o[0]==='add'||o[0]==='drop') && !g.open; return '<button class="chip" role="button" aria-pressed="'+(S.kinds.indexOf(o[0])>=0?'true':'false')+'" data-k="'+o[0]+'"'+(dis?' disabled':'')+'><span class="tick">✓</span>'+esc(o[1])+'</button>'; }).join('')+'</div>'+
    (!g.open?'<div class="note">Roster adds and drops open '+(g.opens_after?('after '+esc(fmtDay(g.opens_after))):'after week 4')+'. Until then, use the APA app for roster changes.</div>':'')+
    '<div class="err" id="err"></div><div class="row"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">Continue</button></div></div>';
  Array.prototype.forEach.call(app.querySelectorAll('.chip'), function(el){ el.onclick=function(){ var k=el.getAttribute('data-k'), i=S.kinds.indexOf(k); if(i>=0) S.kinds.splice(i,1); else S.kinds.push(k); el.setAttribute('aria-pressed', i>=0?'false':'true'); }; });
  document.getElementById('back').onclick=showHub;
  document.getElementById('next').onclick=function(){ if(!S.kinds.length){ document.getElementById('err').textContent='Pick at least one change.'; return; } S.step=0; showStep(); };
}
function activeSteps(){
  var order=['captain','cocaptain','mailing','add','drop'];
  var steps=order.filter(function(k){ return S.kinds.indexOf(k)>=0; }).map(function(k){ return { id:k }; });
  steps.push({ id:'reason' }); steps.push({ id:'review' });
  return steps;
}
function showStep(){
  var steps=activeSteps(); if(S.step>=steps.length){ S.step=steps.length-1; }
  var st=steps[S.step]; S.view='step'; chrome();
  if(st.id==='captain'||st.id==='cocaptain') return stepPick(st.id);
  if(st.id==='mailing') return stepMailing();
  if(st.id==='add') return stepAdd();
  if(st.id==='drop') return stepDrop();
  if(st.id==='reason') return stepReason();
  return showReview();
}
function nav(backFn, nextFn, nextLabel){
  document.getElementById('back').onclick=function(){ if(S.step===0) showWhat(); else { S.step--; showStep(); } };
  document.getElementById('next').onclick=nextFn;
}
function stepPick(kind){
  var cur = rosterAll().filter(function(m){ return m.role===(kind==='captain'?'Captain':'Co-Captain'); })[0];
  var picked = S.A[kind]||null;
  app.innerHTML = '<div class="screen"><h2>Who is the new '+(kind==='captain'?'captain':'co-captain')+'?</h2>'+
    '<p class="hint">'+(cur?('Currently '+esc(cur.name)+'. '):'')+'Pick from the roster'+((S.A.adds||[]).length?' or the players you are adding':'')+'. To make someone new the '+(kind==='captain'?'captain':'co-captain')+', add them first.</p>'+
    candidates().filter(function(m){ return !(cur&&m.member_number===cur.member_number); }).map(function(m){ return '<button class="person" role="button" aria-pressed="'+(picked===m.member_number?'true':'false')+'" data-m="'+esc(m.member_number)+'"><span class="box">✓</span><div class="who"><b>'+esc(m.name)+'</b><span>#'+esc(m.member_number)+(m.role&&m.role!=='Member'?(' · '+esc(m.role)):'')+'</span></div></button>'; }).join('')+
    '<div class="err" id="err"></div><div class="row"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">Continue</button></div></div>';
  Array.prototype.forEach.call(app.querySelectorAll('.person'), function(el){ el.onclick=function(){ picked=el.getAttribute('data-m'); S.A[kind]=picked; Array.prototype.forEach.call(app.querySelectorAll('.person'),function(o){ o.setAttribute('aria-pressed','false'); }); el.setAttribute('aria-pressed','true'); }; });
  nav(null, function(){ if(!S.A[kind]){ document.getElementById('err').textContent='Pick someone.'; return; } S.step++; showStep(); });
}
function stepMailing(){
  var cur = S.detail.mailing && S.detail.mailing.contact_name;
  var picked = S.A.mailing||null;
  app.innerHTML = '<div class="screen"><h2>Who should receive the team’s mail?</h2>'+
    '<p class="hint">'+(cur?('Currently '+esc(cur)+'. '):'')+'Patches and league mail go to this player at the address on their APA record. Pick from the roster'+((S.A.adds||[]).length?' or the players you are adding':'')+'.</p>'+
    candidates().map(function(m){ return '<button class="person" role="button" aria-pressed="'+(picked===m.member_number?'true':'false')+'" data-m="'+esc(m.member_number)+'"><span class="box">✓</span><div class="who"><b>'+esc(m.name)+'</b><span>#'+esc(m.member_number)+(m.role&&m.role!=='Member'?(' · '+esc(m.role)):'')+'</span></div></button>'; }).join('')+
    '<div class="err" id="err"></div><div class="row"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">Continue</button></div></div>';
  Array.prototype.forEach.call(app.querySelectorAll('.person'), function(el){ el.onclick=function(){ picked=el.getAttribute('data-m'); S.A.mailing=picked; Array.prototype.forEach.call(app.querySelectorAll('.person'),function(o){ o.setAttribute('aria-pressed','false'); }); el.setAttribute('aria-pressed','true'); }; });
  nav(null, function(){ if(!S.A.mailing){ document.getElementById('err').textContent='Pick someone.'; return; } S.step++; showStep(); });
}
function renderAdded(){
  var el=document.getElementById('added'); if(!el) return;
  el.innerHTML=(S.A.adds||[]).map(function(a){ return '<div class="person"><div class="who"><b>'+esc(a.name)+'</b><span>#'+esc(a.member_number)+(a.flags&&a.flags.length?(' · ⚠ '+esc(a.flags.join(', '))):'')+'</span></div><button class="rm" data-m="'+esc(a.member_number)+'">Remove</button></div>'; }).join('')||'<p class="hint" style="margin:8px 0 0">No one added yet.</p>';
  Array.prototype.forEach.call(el.querySelectorAll('.rm'), function(b){ b.onclick=function(){ var m=b.getAttribute('data-m'); S.A.adds=S.A.adds.filter(function(a){ return a.member_number!==m; }); if(S.A.captain===m) delete S.A.captain; if(S.A.cocaptain===m) delete S.A.cocaptain; renderAdded(); }; });
}
function stepAdd(){
  app.innerHTML = '<div class="screen"><h2>Who are you adding?</h2><p class="hint">Enter each player’s 8-digit APA number — we’ll show the name so you can confirm. New players join at join.poolplayers.com first.</p>'+
    '<div class="addrow"><input id="apa" type="tel" inputmode="numeric" maxlength="8" placeholder="APA number (972…)"><button class="btn primary" id="look">Check</button></div>'+
    '<div class="err" id="err"></div><div class="added" id="added"></div>'+
    '<div class="row"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">Continue</button></div></div>';
  renderAdded();
  var look=document.getElementById('look'), inp=document.getElementById('apa'), err=document.getElementById('err');
  look.onclick=function(){
    var apa=inp.value.replace(/\D/g,''); err.className='err';
    if(apa.length!==8){ err.textContent='An APA number is 8 digits.'; return; }
    if((S.A.adds||[]).some(function(a){ return a.member_number===apa; })){ err.textContent='Already in your list.'; return; }
    look.disabled=true; look.innerHTML='<span class="spin"></span>';
    gas('tc_lookup_member',{ token:S.token, team_id:S.team.team_id, apa:apa }).then(function(res){
      look.disabled=false; look.textContent='Check';
      if(!res.ok){ if(/session/i.test(res.error||'')){ handleSessionErr(res.error); return; } err.textContent=res.error||'Could not check that number.'; return; }
      if(!res.found){ err.textContent=res.error||'Not found.'; return; }
      if(res.on_team){ err.textContent=res.name+' is already on this team.'; return; }
      S.A.adds.push({ member_number:res.member_number, name:res.name, flags:res.flags||[] }); inp.value=''; err.className='err ok'; err.textContent='Added '+res.name+'.'; renderAdded();
    });
  };
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); look.click(); } });
  nav(null, function(){ if(!(S.A.adds||[]).length){ err.className='err'; err.textContent='Add at least one player, or go back and un-pick “Add player(s)”.'; return; } S.step++; showStep(); });
}
function stepDrop(){
  var drops=S.A.drops||[];
  app.innerHTML = '<div class="screen"><h2>Who is leaving the team?</h2><p class="hint">Tap everyone being dropped. To drop the captain or co-captain, name their replacement in this same request.</p>'+
    rosterAll().map(function(m){ var on=drops.indexOf(m.member_number)>=0; var lead=m.role==='Captain'||m.role==='Co-Captain'; return '<button class="person" role="button" aria-pressed="'+(on?'true':'false')+'" data-m="'+esc(m.member_number)+'"><span class="box">✓</span><div class="who"><b>'+esc(m.name)+'</b><span>#'+esc(m.member_number)+'</span></div><span class="role'+(lead?' lead':'')+'">'+esc(m.role)+'</span></button>'; }).join('')+
    '<div class="callout">Some players can only be removed by the league office (for example, anyone who has qualified for Singles Regionals). If APA blocks a drop, we’ll let you know.</div>'+
    '<div class="err" id="err"></div><div class="row"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">Continue</button></div></div>';
  Array.prototype.forEach.call(app.querySelectorAll('.person'), function(el){ el.onclick=function(){ var m=el.getAttribute('data-m'), i=drops.indexOf(m); if(i>=0) drops.splice(i,1); else drops.push(m); S.A.drops=drops; el.setAttribute('aria-pressed', i>=0?'false':'true'); }; });
  nav(null, function(){
    if(!drops.length){ document.getElementById('err').textContent='Pick at least one player, or go back and un-pick “Drop player(s)”.'; return; }
    var need=[]; rosterAll().forEach(function(m){ if(drops.indexOf(m.member_number)>=0){ if(m.role==='Captain'&&!S.A.captain) need.push('captain'); if(m.role==='Co-Captain'&&!S.A.cocaptain) need.push('co-captain'); } });
    if(need.length){ document.getElementById('err').textContent='You’re dropping the '+need.join(' and ')+' — go back to “What do you want to change?” and pick a new one first.'; return; }
    S.step++; showStep();
  });
}
function stepReason(){
  app.innerHTML = '<div class="screen"><h2>Why the change?</h2><p class="hint">A sentence is plenty. This goes to the league office with the request.</p>'+
    '<textarea id="reason" maxlength="2000" placeholder="e.g. Sam moved away; Jordan is taking over as captain.">'+esc(S.A.reason||'')+'</textarea>'+
    '<div class="err" id="err"></div><div class="row"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">Review</button></div></div>';
  nav(null, function(){ var v=document.getElementById('reason').value.trim(); if(!v){ document.getElementById('err').textContent='Tell us why (a sentence is fine).'; return; } S.A.reason=v; S.step++; showStep(); });
}
function buildItems(){
  var items=[];
  if(S.kinds.indexOf('captain')>=0&&S.A.captain) items.push({ kind:'captain', member_number:S.A.captain });
  if(S.kinds.indexOf('cocaptain')>=0&&S.A.cocaptain) items.push({ kind:'cocaptain', member_number:S.A.cocaptain });
  if(S.kinds.indexOf('mailing')>=0&&S.A.mailing) items.push({ kind:'mailing', member_number:S.A.mailing });
  if(S.kinds.indexOf('add')>=0) (S.A.adds||[]).forEach(function(a){ items.push({ kind:'add', member_number:a.member_number }); });
  if(S.kinds.indexOf('drop')>=0) (S.A.drops||[]).forEach(function(m){ items.push({ kind:'drop', member_number:m, note:(S.A.dropNotes||{})[m]||'' }); });
  return items;
}
function showReview(){
  S.view='step'; chrome();
  app.innerHTML = '<div class="screen"><h2>Look right?</h2><p class="hint">We’re checking it against the roster…</p>'+spinScreen('Checking…')+'</div>';
  gas('tc_submit',{ token:S.token, team_id:S.team.team_id, reason:S.A.reason, items:buildItems(), request_id:S.editingId||undefined, dry_run:true }).then(function(res){
    if(!res.ok){ if(/session/i.test(res.error||'')){ handleSessionErr(res.error); return; }
      app.innerHTML='<div class="screen"><h2>One thing to fix</h2><p class="callout" style="margin-top:0">'+esc(res.error)+'</p><div class="row"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="what">Change my answers</button></div></div>';
      document.getElementById('back').onclick=function(){ S.step=Math.max(0,S.step-1); showStep(); }; document.getElementById('what').onclick=showWhat; return; }
    S.view='step'; chrome();
    app.innerHTML = '<div class="screen review"><h2>Look right?</h2><p class="hint">For '+esc(S.team.team_name)+' (#'+esc(S.team.team_number)+'). The league office will review it and make the change in APA.</p>'+
      itemsList(res.items)+'<div class="item"><dt>Reason</dt><dd>'+esc(S.A.reason)+'</dd></div>'+
      '<div class="err" id="err"></div><div class="row"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="send">'+(S.editingId?'Update request':'Send request')+'</button></div></div>';
    document.getElementById('back').onclick=function(){ S.step=Math.max(0,S.step-1); showStep(); };
    document.getElementById('send').onclick=function(){
      var b=this; b.disabled=true; b.innerHTML='<span class="spin"></span>';
      gas('tc_submit',{ token:S.token, team_id:S.team.team_id, reason:S.A.reason, items:buildItems(), request_id:S.editingId||undefined, source:'teamchanges-web' }).then(function(r2){
        if(!r2.ok){ b.disabled=false; b.textContent=S.editingId?'Update request':'Send request'; if(/session/i.test(r2.error||'')){ handleSessionErr(r2.error); return; } document.getElementById('err').textContent=r2.error||'Something went wrong. Try again.'; return; }
        showDone(r2.edited);
      });
    };
  });
}
function showDone(edited){
  S.view='done'; resetDraft(); chrome();
  app.innerHTML = '<div class="screen center"><span class="big-emoji">🎉</span><h2>'+(edited?'Request updated':'Request sent')+'</h2>'+
    '<p class="hint">We emailed you a copy. The league office will make the change in APA Member Services and email you when it’s done. You can edit or withdraw it here until then.</p>'+
    '<div class="row"><button class="btn primary" id="again">Back to my teams</button></div></div>';
  document.getElementById('again').onclick=loadTeams;
}
function showWithdraw(r){
  S.view='withdraw'; chrome();
  app.innerHTML = '<div class="screen"><h2>Withdraw this request?</h2><p class="hint">The league office won’t act on it. You can send a new one any time.</p>'+itemsList(r.items)+
    '<div class="err" id="err"></div><div class="row"><button class="btn ghost" id="back">Keep it</button><button class="btn primary" id="doW">Withdraw</button></div></div>';
  document.getElementById('back').onclick=showHub;
  document.getElementById('doW').onclick=function(){ var b=this; b.disabled=true; b.innerHTML='<span class="spin"></span>';
    gas('tc_withdraw',{ token:S.token, request_id:r.id }).then(function(res){ if(!res.ok){ b.disabled=false; b.textContent='Withdraw'; if(/session/i.test(res.error||'')){ handleSessionErr(res.error); return; } document.getElementById('err').textContent=res.error||'Could not withdraw.'; return; } openTeam(S.team); });
  };
}
/* ── session error recovery ─────────────────────────────────────────────── */
function handleSessionErr(msg){
  try{ localStorage.removeItem(SKEY); }catch(e){}
  S.token=null; S.signedIn=false; resetDraft();
  showLogin(msg||'Your session expired. Sign in again to finish.');
}
/* ── boot: resolve session (magic-link token or stored) ─────────────────── */
function boot(){
  var urlToken = new URLSearchParams(location.search).get('token');
  var stored = null; try{ stored = localStorage.getItem(SKEY); }catch(e){}
  var tok = urlToken || stored;
  if(urlToken){ history.replaceState(null,'',location.pathname); }
  if(!tok){ showLogin(); return; }
  app.innerHTML = spinScreen('Signing you in…');
  gas('tc_verify', { token:tok }).then(function(res){
    if(!res.ok){ try{ localStorage.removeItem(SKEY); }catch(e){} showLogin(urlToken?(res.error||'That link didn’t work. Request a fresh one.'):''); return; }
    S.token=tok; S.signedIn=true; S.firstName=res.first_name||'';
    try{ localStorage.setItem(SKEY, tok); }catch(e){}
    loadTeams();
  });
}
boot();
</script>
</body>
</html>
